<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password – ROA</title>
  <style>
    body { background: #0f0f0f; color: #fff; font-family: sans-serif; text-align: center; padding: 2rem; }
    input { margin: 0.5rem; padding: 0.5rem; width: 80%; max-width: 300px; }
    button { padding: 0.75rem 2rem; background: #ff3c00; border: none; color: #fff; cursor: pointer; }
    .error { color: #ff6b6b; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Reset Your Password</h1>
  <div class="error" id="error-msg"></div>
  <input type="email" id="email" placeholder="Enter your email" /><br><br>
  <button onclick="sendPasswordReset()">Send Reset Email</button>
  <p><a href="login.html" style="color:#ff3c00;">Back to Login</a></p>

  <!-- Firebase v8 Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    function sendPasswordReset() {
      const email = document.getElementById('email').value.trim();
      const err   = document.getElementById('error-msg');
      err.textContent = '';

      if (!email) {
        err.textContent = 'Please enter your email address.';
        return;
      }

      firebase.auth()
        .sendPasswordResetEmail(email)
        .then(() => {
          alert('Password reset email sent! Check your inbox (and spam).');
        })
        .catch(e => {
          console.error('Reset Error', e);
          err.textContent = e.message;
        });
    }
  </script>
</body>
</html>
