<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up – ROA</title>
  <style>
    body { background:#0f0f0f; color:#fff; font-family:sans-serif; text-align:center; padding:2rem; }
    input { margin:0.5rem; padding:0.5rem; width:80%; max-width:300px; }
    button { padding:0.75rem 2rem; background:#ff3c00; border:none; color:#fff; cursor:pointer; }
    .error { color:#ff6b6b; margin-top:1rem; }
  </style>
</head>
<body>
  <h1>Create an Account</h1>
  <div class="error" id="error-msg"></div>
  <input type="email" id="email" placeholder="Email" /><br>
  <input type="password" id="password" placeholder="Password (min 6 chars)" /><br><br>
  <button onclick="signUp()">Sign Up</button>
  <p>Already have an account? <a href="login.html">Login</a></p>

  <!-- Firebase v8 Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    function signUp() {
      console.log("signUp() called");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const err = document.getElementById("error-msg");
      err.textContent = "";

      // Basic validation
      if (!email || !password) {
        err.textContent = "Please enter both email and password.";
        return;
      }
      if (password.length < 6) {
        err.textContent = "Password must be at least 6 characters.";
        return;
      }

      // Create account
      firebase.auth().createUserWithEmailAndPassword(email, password)
        .then(userCred => {
          // Send verification email
          return userCred.user.sendEmailVerification()
            .then(() => {
              alert("Account created! Verification email sent. Please verify before logging in.");
              window.location.href = "login.html";
            });
        })
        .catch(e => {
          console.error("Signup Error:", e);
          err.textContent = e.message;
        });
    }
  </script>
</body>
</html>
